<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eclipse</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{overflow:hidden;background:#000;color:#fff}
#bg{position:fixed;inset:0;z-index:0}

/* UI */
.left{position:fixed;top:10px;left:10px;z-index:10}
.btn{
padding:10px 18px;border:none;border-radius:999px;
background:linear-gradient(45deg,#6b2cff,#b47cff);
color:#fff;font-weight:700;cursor:pointer
}

.c{
position:relative;
z-index:5;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
transform: translateY(-40px); /* ⬅ подняли центр */
}

.top-text{
font-size:1.2rem;
opacity:0.8;
letter-spacing:2px;
margin-bottom:10px;
}

.l{
font-size:clamp(3rem,7vw,6rem);
font-weight:900;
background:linear-gradient(90deg,#b47cff,#6b2cff,#ff4fd8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent
}

/* BLACK HOLE */
.bh{
width:240px;height:240px;border-radius:50%;
background:radial-gradient(circle at 30% 30%,#080010,#000 70%);
box-shadow:0 0 80px rgba(140,60,255,.6);
position:relative;
animation:pulse 5s infinite
}

@keyframes pulse{
50%{transform:scale(1.05)}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="left">
<button class="btn">Кланы</button>
</div>

<div class="c">
<div class="top-text">Alliance of the</div>
<div class="l">ECLIPSE</div>
<div class="bh"></div>
<button class="btn">Вступить в Альянс</button>
</div>

<script>

const bg = document.getElementById("bg");
const ctx = bg.getContext("2d");

bg.width = innerWidth;
bg.height = innerHeight;

/* ===== STARS ===== */
let stars = [];

/* больше звёзд */
for (let i = 0; i < 450; i++) {
stars.push({
x: Math.random() * bg.width,
y: Math.random() * bg.height,
vx: (Math.random() - 0.5) * 0.3,
vy: (Math.random() - 0.5) * 0.3,
r: Math.random() * 1.8 + 0.2, // больше мелких звёзд
tw: Math.random() * 1,
speed: Math.random() * 0.6 + 0.2
});
}

function draw() {

ctx.fillStyle = "rgba(0,0,0,0.35)";
ctx.fillRect(0, 0, bg.width, bg.height);

/* центр чуть выше (чёрная дыра) */
let cx = bg.width / 2;
let cy = bg.height / 2 - 40;

for (let s of stars) {

/* случайное "космическое" движение */
s.vx += (Math.random() - 0.5) * 0.02;
s.vy += (Math.random() - 0.5) * 0.02;

/* расстояние до дыры */
let dx = cx - s.x;
let dy = cy - s.y;
let dist = Math.sqrt(dx * dx + dy * dy);

/* гравитация только если близко */
if (dist < 260) {
let force = (1 - dist / 260) * 0.8;
s.vx += dx * force * 0.01;
s.vy += dy * force * 0.01;
}

/* движение */
s.x += s.vx;
s.y += s.vy;

/* затухание */
s.vx *= 0.99;
s.vy *= 0.99;

/* если слишком близко — "засасывает" */
if (dist < 18) {
s.x = Math.random() * bg.width;
s.y = Math.random() * bg.height;
s.vx = 0;
s.vy = 0;
}

/* мерцание */
s.tw += 0.03;
let alpha = 0.3 + Math.sin(s.tw) * 0.5;

/* рисование */
ctx.fillStyle = `rgba(180,120,255,${alpha})`;
ctx.beginPath();
ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
ctx.fill();
}

requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
