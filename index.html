<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{overflow:hidden;background:#000;color:#fff}
#bg{position:fixed;inset:0;z-index:0}

/* UI */
.left{position:fixed;top:10px;left:10px;z-index:20}
.btn{padding:10px 18px;border:none;border-radius:999px;background:linear-gradient(45deg,#6b2cff,#b47cff);color:#fff;font-weight:700;cursor:pointer}

.c{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.l{font-size:clamp(3rem,7vw,6rem);font-weight:900;background:linear-gradient(90deg,#b47cff,#6b2cff,#ff4fd8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* BLACK HOLE CORE */
.bh{
width:240px;height:240px;border-radius:50%;
position:relative;
background:radial-gradient(circle at 30% 30%,#0a0010,#000 70%);
box-shadow:0 0 90px rgba(140,60,255,.6);
transform:rotateX(65deg) rotateZ(25deg);
}

/* INNER CORE */
.bh:before{
content:"";
position:absolute;
inset:40px;
border-radius:50%;
background:radial-gradient(circle,#000 40%,#120018 100%);
}

/* TILTED ACCRETION RINGS */
.bh:after{
content:"";
position:absolute;
inset:-60px;
border-radius:50%;
background:
conic-gradient(
from 0deg,
transparent 0deg,
rgba(180,120,255,.0) 25deg,
rgba(180,120,255,.9) 70deg,
transparent 120deg,
rgba(255,90,220,.5) 170deg,
transparent 240deg,
rgba(120,60,255,.7) 310deg,
transparent 360deg
);
mask:radial-gradient(circle,transparent 55%,#000 70%);
filter:blur(1.5px);
opacity:.85;
animation:spin 10s linear infinite;

/* perspective tilt */
transform:rotateX(70deg) rotateZ(0deg);
}

@keyframes spin{
to{transform:rotateX(70deg) rotateZ(360deg)}
}
</style></head>

<body>

<canvas id="bg"></canvas>

<div class="left">
<button class="btn" onclick="openC()">Кланы</button>
</div>

<div class="c">
<div class="l">ECLIPSE</div>
<div class="bh"></div>
<button class="btn">Вступить в Альянс</button>
</div>

<script>

/* ===== COSMIC GRAVITY BACKGROUND ===== */
const bg=document.getElementById("bg"),x=bg.getContext("2d");
bg.width=innerWidth;bg.height=innerHeight;

let stars=[...Array(220)].map(()=>spawn());

function spawn(){
let a=Math.random()*Math.PI*2;
let d=bg.width/2+Math.random()*bg.width/2;
return{
x:bg.width/2+Math.cos(a)*d,
y:bg.height/2+Math.sin(a)*d,
vx:0,vy:0
};
}

function draw(){
x.fillStyle="rgba(0,0,0,.35)";
x.fillRect(0,0,bg.width,bg.height);

let cx=bg.width/2,cy=bg.height/2;

for(let s of stars){

let dx=cx-s.x;
let dy=cy-s.y;
let dist=Math.sqrt(dx*dx+dy*dy)+1;

/* gravity pull */
let f=140/dist;
s.vx+=dx/dist*f*0.02;
s.vy+=dy/dist*f*0.02;

s.x+=s.vx;
s.y+=s.vy;

/* respawn */
if(dist<25)Object.assign(s,spawn());

x.fillStyle="rgba(180,120,255,.8)";
x.fillRect(s.x,s.y,2,2);
}

requestAnimationFrame(draw);
}
draw();

</script>

</body></html>
