<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{overflow:hidden;background:#000;color:#fff}
#bg{position:fixed;inset:0;z-index:0}

/* UI */
.left{position:fixed;top:10px;left:10px;z-index:20;display:flex;flex-direction:column;gap:6px}
.btn{padding:10px 18px;border:none;border-radius:999px;background:linear-gradient(45deg,#6b2cff,#b47cff);color:#fff;font-weight:700;cursor:pointer}

.c{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.l{font-size:clamp(3rem,7vw,6rem);font-weight:900;background:linear-gradient(90deg,#b47cff,#6b2cff,#ff4fd8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* BLACK HOLE */
.bh{
width:220px;height:220px;border-radius:50%;
margin:20px;
position:relative;
background:radial-gradient(circle at 30% 30%,#0b0010,#000 70%);
box-shadow:0 0 80px rgba(140,60,255,.6);
}

/* CORE */
.bh:before{
content:"";
position:absolute;
inset:35px;
border-radius:50%;
background:radial-gradient(circle,#000 40%,#120018 100%);
}

/* ACCRETION RINGS (FIXED - NOT COVERING CENTER) */
.bh:after{
content:"";
position:absolute;
inset:-40px;
border-radius:50%;
background:
conic-gradient(
from 0deg,
transparent 0deg,
rgba(180,120,255,.0) 20deg,
rgba(180,120,255,.7) 60deg,
transparent 110deg,
rgba(255,90,220,.5) 160deg,
transparent 240deg,
rgba(120,60,255,.6) 300deg,
transparent 360deg
);
mask:radial-gradient(circle,transparent 58%,#000 62%);
opacity:.85;
filter:blur(1px);
animation:ring 8s linear infinite;
}

@keyframes ring{
to{transform:rotate(360deg)}
}
</style></head>

<body>

<canvas id="bg"></canvas>

<div class="left">
<button class="btn" onclick="openC()">Кланы</button>
</div>

<div class="c">
<div class="l">ECLIPSE</div>
<div class="bh"></div>
<button class="btn">Вступить в Альянс</button>
</div>

<!-- CLANS -->
<div class="o" id="cl" onclick="closeM(event)">
<div class="m">
<div class="btn">💧 Культ воды</div>
<div class="btn">🌌 Nebula</div>
<div class="btn">✨ Люкверианство</div>
<div class="btn">🤖 ИИ</div>
<div class="btn">👁 Imperial</div>
</div>
</div>

<script>

/* ===== CANVAS ===== */
const bg=document.getElementById("bg"),x=bg.getContext("2d");
bg.width=innerWidth;bg.height=innerHeight;

/* stars with gravity */
let s=[...Array(220)].map(()=>spawn());

function spawn(){
let a=Math.random()*Math.PI*2;
let d=bg.width/2+Math.random()*bg.width/2;
return{
x:bg.width/2+Math.cos(a)*d,
y:bg.height/2+Math.sin(a)*d,
vx:0,vy:0
};
}

function draw(){
x.fillStyle="rgba(0,0,0,.35)";
x.fillRect(0,0,bg.width,bg.height);

let cx=bg.width/2,cy=bg.height/2;

for(let p of s){

let dx=cx-p.x;
let dy=cy-p.y;
let dist=Math.sqrt(dx*dx+dy*dy)+1;

/* gravity pull */
let force=120/dist;
p.vx+=dx/dist*force*0.02;
p.vy+=dy/dist*force*0.02;

p.x+=p.vx;
p.y+=p.vy;

/* reset if swallowed */
if(dist<25){
Object.assign(p,spawn());
}

x.fillStyle="rgba(180,120,255,.8)";
x.fillRect(p.x,p.y,2,2);
}

requestAnimationFrame(draw);
}
draw();

/* MODAL */
let cl=document.getElementById("cl");
function openC(){cl.style.display="flex"}
function closeM(e){if(!e||e.target.classList.contains("o"))cl.style.display="none"}

</script>

</body></html>
