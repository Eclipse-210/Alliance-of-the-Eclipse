<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{overflow:hidden;background:#000;color:#fff}

/* 3D SPACE CANVAS */
#bg{position:fixed;inset:0;z-index:0}

/* UI */
.c{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.t{opacity:.7;letter-spacing:8px}
.l{font-size:clamp(3rem,7vw,6rem);font-weight:900;background:linear-gradient(90deg,#b47cff,#6b2cff,#ff4fd8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bh{width:210px;height:210px;border-radius:50%;margin:20px;background:radial-gradient(circle at 30% 30%,#1b0020,#000 60%);box-shadow:0 0 80px #7b2cff;animation:p 4s infinite}
@keyframes p{50%{transform:scale(1.06)}}
.btn{padding:12px 28px;margin:6px;border:none;border-radius:999px;background:linear-gradient(45deg,#6b2cff,#b47cff);color:#fff;font-weight:700;cursor:pointer}

/* TOP BUTTON */
.minig{position:fixed;top:10px;right:10px;z-index:10}

/* MODALS */
.o{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:20}
.m{background:rgba(255,255,255,.06);padding:15px;border-radius:15px;border:1px solid rgba(255,255,255,.1)}

/* CLANS */
.cl{padding:8px;margin:6px;background:rgba(255,255,255,.05);border-radius:8px;cursor:pointer}

/* TETRIS */
#t{background:#000;border:1px solid #444}

/* CONTROLS TEXT */
small{opacity:.7}
</style></head>

<body>

<canvas id="bg"></canvas>

<div class="minig">
<button class="btn" onclick="openT()">Мини-игры</button>
<button class="btn" onclick="openC()">Кланы</button>
</div>

<div class="c">
<div class="t">ALLIANCE OF THE</div>
<div class="l">ECLIPSE</div>
<div class="bh"></div>
<button class="btn" onclick="window.open('https://discord.gg/eDNTK7cHpJ','_blank')">Альянс</button>
</div>

<!-- CLANS -->
<div class="o" id="cl" onclick="closeM(event)">
<div class="m">
<div class="cl" onclick="window.open('https://discord.gg/WnSjf542Qx','_blank')">🌌 Nebula</div>
<div class="cl">💧 Культ воды</div>
<div class="cl">✨ Люкверианство</div>
<div class="cl">🤖 ИИ</div>
<div class="cl">👁 Imperial of Golden Eye</div>
</div>
</div>

<!-- TETRIS -->
<div class="o" id="tr" onclick="closeM(event)">
<div class="m">
<canvas id="t" width="200" height="400"></canvas>
<br><small>← → движение | ↑ поворот | ↓ ускорение</small>
</div>
</div>

<script>

/* ===== 3D SPACE ===== */
const c=document.getElementById("bg"),x=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let s=[...Array(250)].map(()=>({
x:(Math.random()-0.5)*c.width,
y:(Math.random()-0.5)*c.height,
z:Math.random()*c.width
}));
function d(){
x.fillStyle="#000";x.fillRect(0,0,c.width,c.height);
for(let p of s){
p.z-=2;if(p.z<=0)p.z=c.width;
let k=128/p.z;
let sx=p.x*k+c.width/2;
let sy=p.y*k+c.height/2;
if(sx<0||sx>c.width||sy<0||sy>c.height)continue;
x.fillStyle="#b47cff";
x.fillRect(sx,sy,2,2);
}
requestAnimationFrame(d);
}
d();

/* ===== MODALS ===== */
let cl=document.getElementById("cl"),tr=document.getElementById("tr");
function openC(){cl.style.display="flex"}
function openT(){tr.style.display="flex"}
function closeM(e){if(!e||e.target.classList.contains("o")){cl.style.display="none";tr.style.display="none"}}

/* ===== TETRIS ===== */
const g=document.getElementById("t"),g2=g.getContext("2d");
const W=10,H=20,S=20;
let board=[...Array(H)].map(()=>Array(W).fill(0));

let piece=[[1,1,1,1]],x0=3,y0=0;

function draw(){
g2.fillStyle="#000";g2.fillRect(0,0,g.width,g.height);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
if(board[y][x]){g2.fillStyle="#7b2cff";g2.fillRect(x*S,y*S,S-1,S-1)}
}
for(let y=0;y<piece.length;y++)
for(let x=0;x<piece[y].length;x++)
if(piece[y][x]){
g2.fillStyle="#b47cff";
g2.fillRect((x0+x)*S,(y0+y)*S,S-1,S-1);
}
}

function tick(){
y0++;
if(coll()){
y0--;merge();clear();y0=0;
}
draw();
requestAnimationFrame(tick);
}

function coll(){
for(let y=0;y<piece.length;y++)
for(let x=0;x<piece[y].length;x++)
if(piece[y][x]){
let nx=x0+x,ny=y0+y;
if(ny>=H||nx<0||nx>=W||board[ny]?.[nx])return true;
}
return false;
}

function merge(){
for(let y=0;y<piece.length;y++)
for(let x=0;x<piece[y].length;x++)
if(piece[y][x])board[y0+y][x0+x]=1;
}

function clear(){
for(let y=H-1;y>=0;y--)
if(board[y].every(v=>v)){
board.splice(y,1);
board.unshift(Array(W).fill(0));
}
}

document.addEventListener("keydown",e=>{
if(tr.style.display!="flex")return;
if(e.key=="ArrowLeft")x0--;
if(e.key=="ArrowRight")x0++;
if(e.key=="ArrowDown")y0++;
if(e.key=="ArrowUp")piece=piece[0].map((_,i)=>piece.map(r=>r[i]).reverse());
if(coll()){if(e.key=="ArrowLeft")x0++;if(e.key=="ArrowRight")x0--;if(e.key=="ArrowDown")y0--}
});

draw();tick();

</script>

</body></html>
