<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eclipse</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

html,body{
height:100%;
overflow:hidden;
background:#000;
}

.app{
position:relative;
width:100%;
height:100%;
isolation:isolate;
}

/* canvas */
#bg{
position:absolute;
inset:0;
z-index:0;
pointer-events:none;
}

/* UI */
.ui{
position:relative;
z-index:10;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
transform: translateY(-90px);
}

.left{
position:absolute;
top:10px;
left:10px;
z-index:20;
}

.btn{
padding:10px 18px;
border:none;
border-radius:999px;
background:linear-gradient(45deg,#6b2cff,#b47cff);
color:#fff;
font-weight:700;
cursor:pointer;
transition:0.2s;
position:relative;
}

.btn:hover{
transform:scale(1.05);
}

.big-btn{
padding:16px 28px;
font-size:1.1rem;
background:linear-gradient(45deg,#6b2cff,#ff4fd8);
box-shadow:0 0 25px rgba(180,120,255,.4);
}

.top-text{
font-size:1.2rem;
opacity:0.8;
letter-spacing:2px;
}

.l{
font-size:clamp(3rem,7vw,6rem);
font-weight:900;
background:linear-gradient(90deg,#b47cff,#6b2cff,#ff4fd8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.bh{
width:240px;
height:240px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%,#080010,#000 70%);
box-shadow:0 0 90px rgba(140,60,255,.7);
animation:pulse 5s infinite;
margin:10px 0 18px 0;
}

@keyframes pulse{
50%{transform:scale(1.05)}
}
</style>
</head>

<body>

<div class="app">

<canvas id="bg"></canvas>

<div class="left">
<button class="btn">Кланы</button>
</div>

<div class="ui">
<div class="top-text">Alliance of the</div>
<div class="l">ECLIPSE</div>
<div class="bh"></div>

<a href="https://discord.gg/WYHwR8jvTc" target="_blank">
<button id="joinBtn" class="btn big-btn">Вступить в Альянс</button>
</a>

</div>

</div>

<script>

const bg = document.getElementById("bg");
const ctx = bg.getContext("2d");
const joinBtn = document.getElementById("joinBtn");

function resize(){
bg.width = innerWidth;
bg.height = innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* ⭐ звёзды */
let stars = [];

for(let i=0;i<650;i++){
stars.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
vx:(Math.random()-0.5)*1.3,
vy:(Math.random()-0.5)*1.3,
r:Math.random()*1.5+0.2,
tw:Math.random()*1
});
}

function draw(){

ctx.fillStyle="rgba(0,0,0,0.35)";
ctx.fillRect(0,0,bg.width,bg.height);

let cx = bg.width/2;
let cy = bg.height/2 - 40;

for(let s of stars){

s.vx += (Math.random()-0.5)*0.05;
s.vy += (Math.random()-0.5)*0.05;

let dx = cx - s.x;
let dy = cy - s.y;
let dist = Math.sqrt(dx*dx + dy*dy);

/* гравитация */
if(dist < 340){
let force = (1 - dist/340);
s.vx += dx * force * 0.02;
s.vy += dy * force * 0.02;
}

s.x += s.vx;
s.y += s.vy;

s.vx *= 0.99;
s.vy *= 0.99;

/* спагеттификация */
if(dist < 140){

ctx.strokeStyle = `rgba(180,120,255,0.6)`;
ctx.lineWidth = Math.max(0.5,(140-dist)/50);

ctx.beginPath();
ctx.moveTo(s.x,s.y);
ctx.lineTo(s.x - s.vx*8, s.y - s.vy*8);
ctx.stroke();

}else{

s.tw += 0.04;
let a = 0.3 + Math.sin(s.tw)*0.5;

ctx.fillStyle = `rgba(180,120,255,${a})`;
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
}

/* respawn */
if(dist < 8){
s.x = Math.random()*bg.width;
s.y = Math.random()*bg.height;
s.vx = 0;
s.vy = 0;
}

}

/* ⭐ ГРАВИТАЦИЯ КНОПКИ */
let rect = joinBtn.getBoundingClientRect();

let bx = rect.left + rect.width/2;
let by = rect.top + rect.height/2;

let dx = cx - bx;
let dy = cy - by;
let dist = Math.sqrt(dx*dx + dy*dy);

if(dist < 500){

let pull = (1 - dist/500) * 18;

/* лёгкое “тягивание” */
let offsetX = dx * pull * 0.02;
let offsetY = dy * pull * 0.02;

/* дрожание при близости */
if(dist < 200){
offsetX += (Math.random()-0.5)*2;
offsetY += (Math.random()-0.5)*2;
}

joinBtn.style.transform =
`translate(${offsetX}px, ${offsetY}px) scale(${1 + pull*0.02})`;

}else{
joinBtn.style.transform = "translate(0px,0px)";
}

requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
