<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{overflow:hidden;background:#000;color:#fff}
#bg{position:fixed;inset:0;z-index:0}

/* LEFT MENU */
.left{position:fixed;top:10px;left:10px;z-index:20;display:flex;flex-direction:column;gap:6px}
.btn{padding:10px 18px;border:none;border-radius:999px;background:linear-gradient(45deg,#6b2cff,#b47cff);color:#fff;font-weight:700;cursor:pointer}

/* UI */
.c{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.l{font-size:clamp(3rem,7vw,6rem);font-weight:900;background:linear-gradient(90deg,#b47cff,#6b2cff,#ff4fd8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bh{width:210px;height:210px;border-radius:50%;margin:20px;background:radial-gradient(circle at 30% 30%,#1b0020,#000 60%);box-shadow:0 0 80px #7b2cff;animation:p 4s infinite}
@keyframes p{50%{transform:scale(1.06)}}

/* MODAL */
.o{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:30}
.m{background:rgba(255,255,255,.06);padding:15px;border-radius:15px}

/* TETRIS */
#t{background:#000;border:1px solid #444}
.ctrl{display:grid;grid-template-columns:repeat(3,50px);gap:5px;justify-content:center;margin-top:10px}
.ctrl button{padding:10px;background:#6b2cff;color:#fff;border:none;border-radius:8px;font-weight:700}

/* SCORE */
.hud{position:fixed;top:10px;right:10px;z-index:20;font-size:14px}

/* TOP INSIDE TETRIS */
.rank{position:absolute;right:10px;top:10px;font-size:12px;text-align:right}
</style></head>

<body>

<canvas id="bg"></canvas>

<!-- LEFT BUTTONS -->
<div class="left">
<button class="btn" onclick="openT()">Тетрис</button>
<button class="btn" onclick="openC()">Кланы</button>
</div>

<div class="hud">Score: <span id="sc">0</span></div>

<!-- CENTER -->
<div class="c">
<div class="l">ECLIPSE</div>
<div class="bh"></div>

<!-- ALIANCE BUTTON STAYS HERE -->
<button class="btn" onclick="window.open('https://discord.gg/eDNTK7cHpJ','_blank')">
Вступить в альянс
</button>
</div>

<!-- CLANS -->
<div class="o" id="cl" onclick="closeM(event)">
<div class="m">
<div class="btn" onclick="window.open('https://discord.gg/UFcfHVH5gz','_blank')">💧 Культ воды</div>
<div class="btn" onclick="window.open('https://discord.gg/WnSjf542Qx','_blank')">🌌 Nebula</div>
<div class="btn">🤖 ИИ</div>
<div class="btn">👁 Imperial</div>
</div>
</div>

<!-- TETRIS -->
<div class="o" id="tr" onclick="closeM(event)">
<div class="m" style="position:relative">

<div class="rank">
TOP1:<span id="t1">-</span><br>
<small>TOP2:<span id="t2">-</span></small>
</div>

<canvas id="t" width="200" height="400"></canvas>

<div class="ctrl">
<div></div><button onclick="rot()">⟳</button><div></div>
<button onclick="left()">◀</button><button onclick="down()">▼</button><button onclick="right()">▶</button>
</div>

</div>
</div>

<script>

/* BACKGROUND */
const bg=document.getElementById("bg"),x=bg.getContext("2d");
bg.width=innerWidth;bg.height=innerHeight;
let s=[...Array(200)].map(()=>({x:(Math.random()-0.5)*bg.width,y:(Math.random()-0.5)*bg.height,z:Math.random()*bg.width}));
(function d(){
x.fillStyle="#000";x.fillRect(0,0,bg.width,bg.height);
for(let p of s){
p.z-=2;if(p.z<=0)p.z=bg.width;
let k=120/p.z;
x.fillStyle="#b47cff";
x.fillRect(p.x*k+bg.width/2,p.y*k+bg.height/2,2,2);
}
requestAnimationFrame(d);
})();

/* MODALS */
let tr=document.getElementById("tr"),cl=document.getElementById("cl");
function openT(){tr.style.display="flex"}
function openC(){cl.style.display="flex"}
function closeM(e){if(!e||e.target.classList.contains("o")){tr.style.display="none";cl.style.display="none"}}

/* ===== TETRIS ===== */
const g=document.getElementById("t"),g2=g.getContext("2d");
const W=10,H=20,S=20;
let board=[...Array(H)].map(()=>Array(W).fill(0));
let piece=[[1,1,1,1]],x0=3,y0=0;

let score=0,drop=8000;

let top1=localStorage.getItem("t1")||0;
let top2=localStorage.getItem("t2")||0;
document.getElementById("t1").textContent=top1;
document.getElementById("t2").textContent=top2;

function updateTop(){
if(score>top1){top2=top1;top1=score}
else if(score>top2){top2=score}
localStorage.setItem("t1",top1);
localStorage.setItem("t2",top2);
document.getElementById("t1").textContent=top1;
document.getElementById("t2").textContent=top2;
}

function draw(){
g2.fillStyle="#000";g2.fillRect(0,0,200,400);
for(let y=0;y<H;y++)for(let x=0;x<W;x++)
if(board[y][x])g2.fillRect(x*S,y*S,S-1,S-1);
for(let y=0;y<piece.length;y++)
for(let x=0;x<piece[y].length;x++)
if(piece[y][x])g2.fillRect((x0+x)*S,(y0+y)*S,S-1,S-1);
document.getElementById("sc").textContent=score;
}

function coll(){
for(let y=0;y<piece.length;y++)
for(let x=0;x<piece[y].length;x++)
if(piece[y][x]){
let nx=x0+x,ny=y0+y;
if(ny>=H||nx<0||nx>=W||board[ny]?.[nx])return true;
}
return false;
}

function merge(){
for(let y=0;y<piece.length;y++)
for(let x=0;x<piece[y].length;x++)
if(piece[y][x])board[y0+y][x0+x]=1;
}

function clear(){
for(let y=H-1;y>=0;y--)
if(board[y].every(v=>v)){
board.splice(y,1);
board.unshift(Array(W).fill(0));
score+=100;
drop=Math.max(500,8000-(score/1000)*500);
updateTop();
}
}

/* AUTO DROP FIXED SPEED */
function loop(){
let now=Date.now();
if(!loop.t)loop.t=now;
if(now-loop.t>drop){
loop.t=now;
y0++;
if(coll()){y0--;merge();clear();y0=0}
}
draw();
requestAnimationFrame(loop);
}
loop();

/* CONTROLS */
function left(){x0--;if(coll())x0++}
function right(){x0++;if(coll())x0--}
function down(){y0++;if(coll())y0--}
function rot(){piece=piece[0].map((_,i)=>piece.map(r=>r[i]).reverse())}

document.addEventListener("keydown",e=>{
if(tr.style.display!="flex")return;
if(e.key=="ArrowLeft")left();
if(e.key=="ArrowRight")right();
if(e.key=="ArrowDown")down();
if(e.key=="ArrowUp")rot();
});

</script>
</body></html>
