<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{overflow:hidden;background:#000;color:#fff}
#bg{position:fixed;inset:0;z-index:0}

/* UI */
.left{position:fixed;top:10px;left:10px;z-index:20;display:flex;flex-direction:column;gap:6px}
.btn{padding:10px 18px;border:none;border-radius:999px;background:linear-gradient(45deg,#6b2cff,#b47cff);color:#fff;font-weight:700;cursor:pointer}

.c{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.l{font-size:clamp(3rem,7vw,6rem);font-weight:900;background:linear-gradient(90deg,#b47cff,#6b2cff,#ff4fd8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* BLACK HOLE */
.bh{
width:220px;height:220px;border-radius:50%;
margin:20px;
position:relative;
background:radial-gradient(circle at 30% 30%,#120012,#000 65%);
box-shadow:0 0 90px rgba(123,44,255,.6);
animation:spin 8s linear infinite;
}

/* INNER CORE */
.bh:before{
content:"";
position:absolute;
inset:20px;
border-radius:50%;
background:radial-gradient(circle,#000 40%,#1a001f 100%);
}

/* RING SYSTEM */
.bh:after{
content:"";
position:absolute;
inset:-35px;
border-radius:50%;
background:conic-gradient(
from 0deg,
transparent 0deg,
rgba(180,120,255,.0) 40deg,
rgba(180,120,255,.8) 90deg,
rgba(255,80,200,.4) 140deg,
transparent 220deg,
rgba(120,60,255,.6) 280deg,
transparent 360deg
);
filter:blur(2px);
opacity:.8;
animation:ring 6s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg) scale(1)}
50%{transform:rotate(180deg) scale(1.05)}
100%{transform:rotate(360deg) scale(1)}
}

@keyframes ring{
0%{transform:rotate(0deg) scale(1)}
100%{transform:rotate(360deg) scale(1)}
}

/* MODAL */
.o{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:30}
.m{background:rgba(255,255,255,.06);padding:15px;border-radius:15px}

.cl{padding:10px;margin:6px;background:rgba(255,255,255,.05);border-radius:10px;cursor:pointer;transition:.2s}
.cl:hover{transform:translateX(5px);background:rgba(180,120,255,.2)}
</style></head>

<body>

<canvas id="bg"></canvas>

<div class="left">
<button class="btn" onclick="openC()">Кланы</button>
</div>

<div class="c">
<div class="l">ECLIPSE</div>

<div class="bh"></div>

<button class="btn" onclick="window.open('https://discord.gg/eDNTK7cHpJ','_blank')">
Вступить в Альянс
</button>
</div>

<!-- CLANS -->
<div class="o" id="cl" onclick="closeM(event)">
<div class="m">

<div class="cl" onclick="window.open('https://discord.gg/UFcfHVH5gz','_blank')">💧 Культ воды</div>
<div class="cl" onclick="window.open('https://discord.gg/WnSjf542Qx','_blank')">🌌 Nebula</div>
<div class="cl" onclick="window.open('https://discord.gg/yCUk3xDRsk','_blank')">✨ Люкверианство</div>
<div class="cl">🤖 ИИ</div>
<div class="cl">👁 Imperial of Golden Eye</div>

</div>
</div>

<script>

/* COSMIC BACKGROUND */
const bg=document.getElementById("bg"),x=bg.getContext("2d");
bg.width=innerWidth;bg.height=innerHeight;

let s=[...Array(160)].map(()=>({
x:(Math.random()-0.5)*bg.width,
y:(Math.random()-0.5)*bg.height,
z:Math.random()*bg.width
}));

function draw(){
x.fillStyle="#000";
x.fillRect(0,0,bg.width,bg.height);

for(let p of s){
p.z-=1.5;if(p.z<=0)p.z=bg.width;
let k=120/p.z;
x.fillStyle="rgba(180,120,255,.7)";
x.fillRect(p.x*k+bg.width/2,p.y*k+bg.height/2,2,2);
}

requestAnimationFrame(draw);
}
draw();

/* MODAL */
let cl=document.getElementById("cl");
function openC(){cl.style.display="flex"}
function closeM(e){if(!e||e.target.classList.contains("o"))cl.style.display="none"}

</script>

</body></html>
