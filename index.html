<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eclipse</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
overflow:hidden;
background:#000;
color:#fff;
}

/* ⭐ фон */
#bg{
position:fixed;
inset:0;
z-index:-1;
pointer-events:none;
}

/* UI слой */
.left{
position:fixed;
top:10px;
left:10px;
z-index:100;
}

.btn{
padding:10px 18px;
border:none;
border-radius:999px;
background:linear-gradient(45deg,#6b2cff,#b47cff);
color:#fff;
font-weight:700;
cursor:pointer;
transition:0.2s;
}

.btn:hover{
transform:scale(1.05);
}

/* большая кнопка */
.big-btn{
padding:16px 28px;
font-size:1.1rem;
background:linear-gradient(45deg,#6b2cff,#ff4fd8);
box-shadow:0 0 25px rgba(180,120,255,.4);
}

/* центр */
.c{
position:relative;
z-index:100;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
gap:14px;
transform: translateY(-90px);
}

.top-text{
font-size:1.2rem;
opacity:0.8;
letter-spacing:2px;
}

.l{
font-size:clamp(3rem,7vw,6rem);
font-weight:900;
background:linear-gradient(90deg,#b47cff,#6b2cff,#ff4fd8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* чёрная дыра */
.bh{
width:240px;
height:240px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%,#080010,#000 70%);
box-shadow:0 0 90px rgba(140,60,255,.7);
animation:pulse 5s infinite;
margin:10px 0 18px 0;
}

@keyframes pulse{
50%{transform:scale(1.05)}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="left">
<button class="btn">Кланы</button>
</div>

<div class="c">
<div class="top-text">Alliance of the</div>
<div class="l">ECLIPSE</div>
<div class="bh"></div>
<button class="btn big-btn">Вступить в Альянс</button>
</div>

<script>

const bg = document.getElementById("bg");
const ctx = bg.getContext("2d");

bg.width = innerWidth;
bg.height = innerHeight;

let stars = [];

/* ⭐ больше и быстрее звёзды */
for (let i = 0; i < 600; i++) {
stars.push({
x: Math.random() * bg.width,
y: Math.random() * bg.height,
vx: (Math.random() - 0.5) * 1.2,
vy: (Math.random() - 0.5) * 1.2,
r: Math.random() * 1.5 + 0.2,
tw: Math.random() * 1
});
}

function draw() {

ctx.fillStyle = "rgba(0,0,0,0.35)";
ctx.fillRect(0,0,bg.width,bg.height);

/* центр дыры (чуть выше) */
let cx = bg.width/2;
let cy = bg.height/2 - 40;

for (let s of stars) {

/* хаотичность космоса */
s.vx += (Math.random() - 0.5) * 0.04;
s.vy += (Math.random() - 0.5) * 0.04;

/* гравитация */
let dx = cx - s.x;
let dy = cy - s.y;
let dist = Math.sqrt(dx*dx + dy*dy);

if (dist < 320) {
let force = (1 - dist/320);
s.vx += dx * force * 0.018;
s.vy += dy * force * 0.018;
}

/* движение */
s.x += s.vx;
s.y += s.vy;

/* трение */
s.vx *= 0.992;
s.vy *= 0.992;

/* ⭐ СПАГЕТТИФИКАЦИЯ */
if (dist < 140) {

ctx.strokeStyle = `rgba(180,120,255,0.6)`;
ctx.lineWidth = Math.max(0.5, (140 - dist)/55);

ctx.beginPath();
ctx.moveTo(s.x, s.y);
ctx.lineTo(
s.x - s.vx * 7,
s.y - s.vy * 7
);
ctx.stroke();

} else {

/* обычная звезда */
s.tw += 0.04;
let alpha = 0.3 + Math.sin(s.tw)*0.5;

ctx.fillStyle = `rgba(180,120,255,${alpha})`;
ctx.beginPath();
ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
ctx.fill();
}

/* пересоздание если упала в дыру */
if (dist < 10) {
s.x = Math.random()*bg.width;
s.y = Math.random()*bg.height;
s.vx = 0;
s.vy = 0;
}

}

requestAnimationFrame(draw);
}

draw();

/* resize fix */
window.addEventListener("resize", () => {
bg.width = innerWidth;
bg.height = innerHeight;
});

</script>

</body>
</html>
